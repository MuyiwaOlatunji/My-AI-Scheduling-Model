<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">Patient Appointment System</div>
            <div class="navbar-links">
                <a href="{{ url_for('index') }}" class="nav-link">Home</a>
                <a href="{{ url_for('patient_dashboard') }}" class="nav-link">Dashboard</a>
                <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container form-container">
        <h1>Book Appointment</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label for="hospital" class="form-label">Hospital</label>
                <select id="hospital" name="hospital" class="form-select" required>
                    <option value="" disabled selected>Select a hospital</option>
                    {% for hospital in hospitals %}
                        <option value="{{ hospital.id }}">{{ hospital.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="department" class="form-label">Department</label>
                <select id="department" name="department" class="form-select" required disabled>
                    <option value="" disabled selected>Select a department</option>
                </select>
            </div>
            <div class="form-group">
                <label for="doctor" class="form-label">Doctor</label>
                <select id="doctor" name="doctor" class="form-select" required disabled>
                    <option value="" disabled selected>Select a doctor</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date" class="form-label">Date</label>
                <input type="date" id="date" name="date" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="time" class="form-label">Time</label>
                <select id="time" name="time" class="form-select" required disabled>
                    <option value="" disabled selected>Select a date first</option>
                </select>
                <div id="slotAvailability" class="slot-unavailable"></div>
                <div id="loadingSpinner" class="spinner-border"></div>
            </div>
            <div class="form-group">
                <label for="health_challenge" class="form-label">Health Challenge</label>
                <input type="text" id="health_challenge" name="health_challenge" class="form-control" required>
            </div>
            <button type="submit" id="submitBtn" class="btn btn-primary btn-sm" disabled><i class="fas fa-calendar-check"></i> Book Appointment</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
